name: Fishnet lab checks
on:
  pull_request:
    branches: [lab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy lightgbm
      - run: python -m compileall -q research
      - run: python -m unittest discover -s research -p 'test_*.py' -v
