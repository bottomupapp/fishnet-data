name: Fishnet model safety tests
on:
  pull_request:
    paths:
      - 'research/quality.py'
      - 'research/test_quality.py'
      - '.github/workflows/model-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - run: python -m unittest discover -s research -p 'test_quality.py' -v
