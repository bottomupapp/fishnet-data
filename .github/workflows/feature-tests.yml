name: Fishnet feature integration tests
on:
  pull_request:
    paths:
      - 'research/features.py'
      - 'research/quality.py'
      - 'research/test_integration.py'
      - 'research/run.py'
      - 'research/split_safety.py'
      - 'research/test_split_safety.py'
      - '.github/workflows/feature-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy pyarrow lightgbm
      - run: python -m unittest discover -s research -p 'test_*.py' -v
