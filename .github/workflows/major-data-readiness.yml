name: Fishnet major-coin data readiness
on:
  pull_request:
    paths:
      - 'research/test_risk_portfolio.py'
      - '.github/workflows/major-data-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  major-parquet-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research/audit_data.py
            data/BTCUSDT
            data/ETHUSDT
            data/SOLUSDT
            data/BNBUSDT
            data/XRPUSDT
            data/ADAUSDT
            data/AVAXUSDT
            data/LINKUSDT
            data/LTCUSDT
            data/DOGEUSDT
            data/SUIUSDT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow
      - name: Audit all 11 proposed major-coin archives
        run: |
          python research/audit_data.py data \
            BTCUSDT ETHUSDT SOLUSDT BNBUSDT XRPUSDT ADAUSDT \
            AVAXUSDT LINKUSDT LTCUSDT DOGEUSDT SUIUSDT \
            | tee major-readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishnet-major-data-readiness
          path: major-readiness.json
          retention-days: 30
