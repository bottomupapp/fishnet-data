name: Fishnet flexible net R portfolio development grid
on:
  pull_request:
    paths:
      - 'research/rr_model.py'
      - 'research/test_rr_model.py'
      - 'research/reward_grid_summary.py'
      - 'research/test_reward_grid_summary.py'
      - '.github/workflows/flexible-net-r.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy lightgbm
      - run: python -m unittest discover -s research -p 'test_*.py' -v

  features:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research
            data/BTCUSDT
            data/ETHUSDT
            data/SOLUSDT
            data/BNBUSDT
            data/XRPUSDT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow lightgbm
      - name: Generate five-major causal features
        run: |
          python - <<'PY'
          from research.features import build
          build('data',['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT']).to_parquet(
              '/tmp/fishnet-flex-features.parquet',compression='zstd')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fishnet-five-major-flex-R-features
          path: /tmp/fishnet-flex-features.parquet
          retention-days: 7

  candidate:
    needs: features
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        side: [long, short]
        horizon: [60, 240]
        reward:
          - {value: 1.0, slug: "1p0"}
          - {value: 1.5, slug: "1p5"}
          - {value: 2.0, slug: "2p0"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research
            data/BTCUSDT
            data/ETHUSDT
            data/SOLUSDT
            data/BNBUSDT
            data/XRPUSDT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow lightgbm
      - uses: actions/download-artifact@v4
        with:
          name: fishnet-five-major-flex-R-features
          path: /tmp
      - name: Train calibrated model and audit 1% portfolio risk
        env:
          SIDE: ${{ matrix.side }}
          HORIZON: ${{ matrix.horizon }}
          REWARD: ${{ matrix.reward.value }}
          REWARD_SLUG: ${{ matrix.reward.slug }}
        run: |
          python -m research.rr_model /tmp/fishnet-flex-features.parquet data \
            --side "$SIDE" --horizon "$HORIZON" --reward-multiple "$REWARD" --rounds 100 \
            --output "/tmp/fishnet-flex-r-$SIDE-${HORIZON}m-$REWARD_SLUG.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: flex-r-${{ matrix.side }}-${{ matrix.horizon }}m-${{ matrix.reward.slug }}
          path: /tmp/fishnet-flex-r-*.json
          retention-days: 30

  summarize:
    needs: [candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy lightgbm
      - uses: actions/download-artifact@v4
        with:
          pattern: flex-r-*
          path: reports
          merge-multiple: true
      - name: Validate predeclared 12-model comparison without joint-PnL claims
        run: python -m research.reward_grid_summary reports --output reports/fishnet-flex-net-R-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: fishnet-flexible-net-R-one-month-research-comparison
          path: reports/fishnet-flex-net-R-summary.json
          retention-days: 30
