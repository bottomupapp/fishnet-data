name: Fishnet PR validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy lightgbm
      - run: python -m compileall -q research
      - run: python -m unittest discover -s research -p 'test_*.py' -v
  btc-eth-feature-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research
            data/BTCUSDT
            data/ETHUSDT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy pyarrow lightgbm
      - name: Generate actual BTC and ETH features
        run: |
          python - <<'PY'
          from research.features import build
          df = build('data', ['BTCUSDT','ETHUSDT'])
          assert len(df) > 100000, f"Only {len(df)} rows"
          assert not df.duplicated(['t','symbol']).any()
          print(f'Feature rows: {len(df)}')
          print(f'Symbols: {sorted(df.symbol.unique())}')
          print(f'Dates: {df.t.min()} .. {df.t.max()}')
          PY
