name: Fishnet direct net-R regression research
on:
  pull_request:
    paths:
      - 'research/net_r_gate.py'
      - 'research/net_r_regression.py'
      - 'research/test_net_r_regression.py'
      - '.github/workflows/net-r-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas lightgbm
      - run: python -m unittest discover -s research -p 'test_*.py' -v

  features:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research
            data/BTCUSDT
            data/ETHUSDT
            data/SOLUSDT
            data/BNBUSDT
            data/XRPUSDT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow lightgbm
      - name: Build five-major causal features
        run: |
          python - <<'PY'
          from research.features import build
          build('data',['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT']).to_parquet(
              '/tmp/fishnet-net-r-regression-features.parquet',compression='zstd')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: five-major-net-r-regression-features
          path: /tmp/fishnet-net-r-regression-features.parquet
          retention-days: 7

  candidate:
    needs: features
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        side: [long, short]
        horizon: [60, 240]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research
            data/BTCUSDT
            data/ETHUSDT
            data/SOLUSDT
            data/BNBUSDT
            data/XRPUSDT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pyarrow lightgbm
      - uses: actions/download-artifact@v4
        with:
          name: five-major-net-r-regression-features
          path: /tmp
      - name: Predict realized cost-net R with pretest calibration gate
        env:
          SIDE: ${{ matrix.side }}
          HORIZON: ${{ matrix.horizon }}
        run: |
          python -m research.net_r_regression /tmp/fishnet-net-r-regression-features.parquet data \
            --side "$SIDE" --horizon "$HORIZON" --reward 1.5 --rounds 100 \
            --output "/tmp/fishnet-net-r-regression-$SIDE-${HORIZON}m.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fishnet-net-r-regression-${{ matrix.side }}-${{ matrix.horizon }}m
          path: /tmp/fishnet-net-r-regression-*.json
          retention-days: 30
