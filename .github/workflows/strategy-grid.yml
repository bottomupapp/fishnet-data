name: Fishnet LONG-SHORT 5-15-60 development grid
on:
  pull_request:
    paths:
      - 'research/execution.py'
      - 'research/test_short_execution.py'
      - 'research/risk_portfolio.py'
      - 'research/test_risk_portfolio.py'
      - 'research/dev_baseline.py'
      - 'research/multi_month.py'
      - 'research/test_multi_month.py'
      - 'research/grid_summary.py'
      - 'research/joint_portfolio.py'
      - 'research/test_joint_portfolio.py'
      - 'research/test_grid_summary.py'
      - '.github/workflows/strategy-grid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: [y_long_5, y_short_5, y_long_15, y_short_15, y_long_60, y_short_60]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research
            data/BTCUSDT
            data/ETHUSDT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy pyarrow lightgbm
      - name: Run research safety unit tests
        run: python -m unittest discover -s research -p 'test_*.py' -v
      - name: Build BTC ETH research features
        run: |
          python - <<'PY'
          from research.features import build
          build('data', ['BTCUSDT','ETHUSDT']).to_parquet('/tmp/fishnet-grid-features.parquet', compression='zstd')
          PY
      - name: Four independent development folds with cost and risk accounting
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python -m research.multi_month /tmp/fishnet-grid-features.parquet data \
            --target "$TARGET" --rounds 100 --output "/tmp/fishnet-$TARGET-grid.json"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fishnet-grid-${{ matrix.target }}
          path: |
            /tmp/fishnet-y_*-grid.json
            /tmp/fishnet-y_*-dev.json
          retention-days: 30

  summarize:
    needs: [grid]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy lightgbm
      - uses: actions/download-artifact@v4
        with:
          pattern: fishnet-grid-*
          path: reports
          merge-multiple: true
      - name: Summarize all six strategies without touching locked holdout
        run: python -m research.grid_summary reports --output reports/fishnet-six-way-summary.json
      - name: Replay all six directions and horizons through one shared risk book
        run: python -m research.joint_portfolio reports --output reports/fishnet-joint-portfolio.json
      - uses: actions/upload-artifact@v4
        with:
          name: fishnet-six-way-development-summary
          path: |
            reports/fishnet-six-way-summary.json
            reports/fishnet-joint-portfolio.json
          retention-days: 30
